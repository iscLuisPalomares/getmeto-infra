AWSTemplateFormatVersion: '2010-09-09'
Description: getmeto - ECR repository for getmeto-api and the role GitHub uses to push to it

Parameters:
  GitHubOrg:
    Type: String
    Default: iscLuisPalomares
  GitHubOrgId:
    Type: String
    Default: '5873135'
  ApiRepo:
    Type: String
    Default: getmeto-api
  ApiRepoId:
    Type: String
    Default: '1372090883'

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: getmeto-api
      EmptyOnDelete: true          # lets the stack delete even if images exist
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: app
          Value: getmeto

  EcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: getmeto-api-ecr-push
      Description: getmeto-api main branch - push images to the getmeto-api ECR repo only
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}@${GitHubOrgId}/${ApiRepo}@${ApiRepoId}:ref:refs/heads/main
      Policies:
        - PolicyName: PushToApiRepo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'           # this action does not support resource scoping
              - Sid: Push
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ApiRepository.Arn

Outputs:
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  EcrPushRoleArn:
    Value: !GetAtt EcrPushRole.Arn