name: cfn-plan
on:
  pull_request:
    paths: ['infra/**']

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: getmeto-hello
            template: infra/00-hello.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pip install cfn-lint
          cfn-lint ${{ matrix.template }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Create change set (no execute)
        env:
          CS_NAME: pr-${{ github.run_id }}-${{ github.run_attempt }}
          STACK: ${{ matrix.stack }}
          TEMPLATE: ${{ matrix.template }}
        run: |
          # Create if the stack doesn't exist yet, otherwise update
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          if [ "$STACK_STATUS" = "NONE" ] || [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            CS_TYPE=CREATE
          else
            CS_TYPE=UPDATE
          fi

          aws cloudformation create-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CS_NAME" \
            --change-set-type "$CS_TYPE" \
            --template-body "file://$TEMPLATE" \
            --capabilities CAPABILITY_NAMED_IAM

          # Wait for it to finish computing (fails if there are no changes)
          STATUS=0
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK" \
            --change-set-name "$CS_NAME" 2>/dev/null || STATUS=$?

          {
            echo "### Change set for \`$STACK\`"
            if [ "$STATUS" -eq 0 ]; then
              echo '```'
              aws cloudformation describe-change-set \
                --stack-name "$STACK" \
                --change-set-name "$CS_NAME" \
                --query "Changes[].ResourceChange.{Action:Action,Resource:LogicalResourceId,Type:ResourceType,Replacement:Replacement}" \
                --output table
              echo '```'
            else
              aws cloudformation describe-change-set \
                --stack-name "$STACK" \
                --change-set-name "$CS_NAME" \
                --query "StatusReason" --output text
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Clean up so nothing is left behind
          aws cloudformation delete-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CS_NAME" || true